server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
    gzip_min_length 256;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # SPA routing. The shell must never be cached by the browser: it points at
    # content-hashed bundles, so a heuristically-fresh index.html keeps the app
    # requesting the previous release's JS (V64/B47).
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # The shell file itself, same rule (try_files serves it from disk).
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Uploaded files proxy
    location ^~ /uploads/ {
        proxy_pass http://api:3000;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # API proxy
    location /api/ {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # Service worker — never immutable: the SW script must revalidate so a new
    # release replaces the old worker (V64). Matches path only, args ignored.
    location = /sw.js {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
